{% extends "base.html" %}
{% block title %}Devices Map{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">📍 All Devices</h2>
  </div>

  <!-- 🛰 Device Toggle Panel -->
  <div class="card shadow-sm mb-3">
    <div class="card-body p-3">
      <strong class="d-block mb-2">🛰 Devices</strong>
      <div id="deviceToggles" class="d-flex flex-wrap gap-3"></div>
    </div>
  </div>

  <div id="map" style="height: 600px; border-radius: 10px; position: relative; z-index: 1;"></div>
</div>

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  #map {
    width: 100%;
    height: 600px;
  }

  @media (max-width: 768px) {
    #map { height: 400px; }
  }
</style>

<script>
function getSpeedColor(speed) {
  if (speed <= 20) return '#22c55e';
  if (speed <= 60) return '#facc15';
  return '#ef4444';
}

document.addEventListener('DOMContentLoaded', function () {

  const map = L.map('map').setView([20.5937, 78.9629], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const markers = {};
  const trails = {};
  const visibility = {};
  let followedDeviceId = null;   // ⭐ FEATURE 4
  let firstLoad = true;

  async function fetchData() {
    try {
      const res = await fetch('/api/live_feed', { credentials: 'same-origin' });
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) return;

      let bounds = L.latLngBounds([]);

      data.forEach(d => {
        const deviceId = d.deviceId;
        const lat = d.latitude;
        const lng = d.longitude;
        const speed = d.speed || 0;

        if (!lat || !lng) return;

        /* 🔘 Create toggle once per device */
        if (visibility[deviceId] === undefined) {
          visibility[deviceId] = true;

          const container = document.getElementById('deviceToggles');
          const wrapper = document.createElement('div');
          wrapper.className = 'd-flex align-items-center gap-2';

          wrapper.innerHTML = `
            <label class="form-check mb-0">
              <input class="form-check-input" type="checkbox" checked data-id="${deviceId}">
              <span class="form-check-label">Device ${deviceId}</span>
            </label>

            <button class="btn btn-sm btn-outline-primary follow-btn"
                    data-device-id="${deviceId}">
              Follow
            </button>
          `;

          container.appendChild(wrapper);

          // Visibility toggle
          wrapper.querySelector('input').addEventListener('change', (e) => {
            const id = parseInt(e.target.dataset.id);
            visibility[id] = e.target.checked;

            if (markers[id]) {
              visibility[id] ? map.addLayer(markers[id]) : map.removeLayer(markers[id]);
            }
            if (trails[id]) {
              visibility[id] ? map.addLayer(trails[id]) : map.removeLayer(trails[id]);
            }
          });
        }

        /* ❌ Skip update if hidden */
        if (!visibility[deviceId]) return;

        if (!markers[deviceId]) {
          markers[deviceId] = L.marker([lat, lng]).addTo(map);
          markers[deviceId].bindPopup(`
            <b>Device:</b> ${deviceId}<br>
            <b>Speed:</b> ${speed.toFixed(1)} km/h
          `);

          trails[deviceId] = L.polyline([[lat, lng]], {
            color: getSpeedColor(speed),
            weight: 4,
            opacity: 0.85,
            lineCap: 'round'
          }).addTo(map);
        } else {
          markers[deviceId].setLatLng([lat, lng]);
          trails[deviceId].addLatLng([lat, lng]);
          trails[deviceId].setStyle({ color: getSpeedColor(speed) });
        }

        // 🎯 FOLLOW MODE
        if (followedDeviceId === deviceId) {
          map.setView([lat, lng], map.getZoom(), { animate: true });
        }

        bounds.extend([lat, lng]);
      });

      if (firstLoad && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
        firstLoad = false;
      }

    } catch (err) {
      console.error('Live map fetch error:', err);
    }
  }

  // ▶ Follow / Unfollow button handler
  document.addEventListener('click', function (e) {
    if (!e.target.classList.contains('follow-btn')) return;

    const deviceId = parseInt(e.target.dataset.deviceId);

    if (followedDeviceId === deviceId) {
      followedDeviceId = null;
      e.target.textContent = 'Follow';
      e.target.classList.remove('btn-danger');
      e.target.classList.add('btn-outline-primary');
    } else {
      followedDeviceId = deviceId;

      document.querySelectorAll('.follow-btn').forEach(btn => {
        btn.textContent = 'Follow';
        btn.classList.remove('btn-danger');
        btn.classList.add('btn-outline-primary');
      });

      e.target.textContent = 'Unfollow';
      e.target.classList.remove('btn-outline-primary');
      e.target.classList.add('btn-danger');
    }
  });

  fetchData();
  setInterval(fetchData, 5000);

  setTimeout(() => map.invalidateSize(), 500);
});
</script>
{% endblock %}
