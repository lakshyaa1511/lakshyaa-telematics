{% extends "base.html" %}
{% block title %}Verify Account — Lakshyaa Fleet OS{% endblock %}

{% block auth_content %}
<div class="card fleet-card p-4 p-md-5 shadow-lg border-subtle" style="width: 100%; max-width: 440px;">
  <div class="text-center mb-4">
    <div class="brand-icon-wrapper mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
      <i class="bi bi-shield-check"></i>
    </div>
    <h3 class="fw-bold text-white mb-1">Verify Account</h3>
    <p class="text-muted small">Verification code sent to <strong class="text-white">{{ user.email }}</strong></p>
  </div>

  <form method="POST">
    <div class="mb-4">
      <label class="form-label">6-Digit Verification Code (OTP)</label>
      <div class="input-group">
        <span class="input-group-text bg-surface border-subtle text-muted"><i class="bi bi-key"></i></span>
        <input type="text" class="form-control mono-num text-center fs-5 fw-bold" name="otp" placeholder="123456" maxlength="6" required autofocus>
      </div>
      <div class="form-text text-muted small mt-2">
        Enter the verification code to activate your terminal session.
      </div>
    </div>

    <button type="submit" class="btn btn-fleet-primary w-100 py-2 fw-bold">Verify &amp; Activate Account</button>
  </form>

  <div class="text-center mt-4 pt-3 border-top border-subtle">
    <a href="{{ url_for('login') }}" class="text-primary fw-semibold small text-decoration-none">
      <i class="bi bi-arrow-left me-1"></i> Back to Sign In
    </a>
  </div>
</div>
{% endblock %}
