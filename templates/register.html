{% extends "base.html" %}
{% block title %}Register Fleet Account — Lakshyaa{% endblock %}

{% block auth_content %}
<div class="card fleet-card p-4 p-md-5 shadow-lg border-subtle" style="width: 100%; max-width: 480px;">
  <div class="text-center mb-4">
    <div class="brand-icon-wrapper mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
      <i class="bi bi-radar"></i>
    </div>
    <h3 class="fw-bold text-white mb-1">Create Fleet Account</h3>
    <p class="text-muted small">Deploy real-time telematics for your fleet operations</p>
  </div>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="mb-3">
      <label class="form-label">Operator Username</label>
      <div class="input-group">
        <span class="input-group-text bg-surface border-subtle text-muted"><i class="bi bi-person"></i></span>
        <input type="text" class="form-control" name="username" placeholder="e.g. logistics_admin" required autofocus>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <div class="input-group">
        <span class="input-group-text bg-surface border-subtle text-muted"><i class="bi bi-envelope"></i></span>
        <input type="email" class="form-control" name="email" placeholder="admin@yourcompany.com" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-surface border-subtle text-muted"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" name="password" placeholder="At least 6 characters" required>
      </div>
    </div>

    <button type="submit" class="btn btn-fleet-primary w-100 py-2 fw-bold mt-2">Initialize Organization</button>
  </form>

  <div class="text-center mt-4 pt-3 border-top border-subtle">
    <span class="text-muted small">Already have an active fleet? </span>
    <a href="{{ url_for('login') }}" class="text-primary fw-semibold small text-decoration-none">Sign In</a>
  </div>
</div>
{% endblock %}
