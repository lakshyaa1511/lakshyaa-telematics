{% extends "base.html" %}
{% block title %}Forgot Password — Lakshyaa{% endblock %}

{% block auth_content %}
<div class="card fleet-card p-4 p-md-5 shadow-lg border-subtle" style="width: 100%; max-width: 440px;">
  <div class="text-center mb-4">
    <div class="brand-icon-wrapper mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
      <i class="bi bi-key"></i>
    </div>
    <h3 class="fw-bold text-white mb-1">Reset Access</h3>
    <p class="text-muted small">Enter your username or email to recover credentials</p>
  </div>

  <form method="POST">
    <div class="mb-4">
      <label class="form-label">Username or Registered Email</label>
      <div class="input-group">
        <span class="input-group-text bg-surface border-subtle text-muted"><i class="bi bi-person"></i></span>
        <input type="text" name="username" class="form-control" placeholder="Operator username" required autofocus>
      </div>
    </div>
    <button type="submit" class="btn btn-fleet-primary w-100 py-2 fw-bold">Send Recovery Link</button>
  </form>

  <div class="text-center mt-4 pt-3 border-top border-subtle">
    <a href="{{ url_for('login') }}" class="text-primary fw-semibold small text-decoration-none">
      <i class="bi bi-arrow-left me-1"></i> Back to Sign In
    </a>
  </div>
</div>
{% endblock %}
